spring.application.name=r_Place_Clicker
            ### Configuration base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/rplace_db
spring.datasource.username=postgres
spring.datasource.password=1234567
spring.datasource.driver-class-name=org.postgresql.Driver

            ### JPA et Hibernate
# update : cree ou modifie les tables au demarrage sans supprimer les donnees
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

            ### Thymeleaf
# Spring Boot trouve automatiquement les templates dans resources/templates/
# Desactive le cache en developpement (rechargement immediat des templates)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

            ### Serveur
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true