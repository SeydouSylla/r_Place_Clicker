spring.application.name=r_Place_Clicker

### Base de donnees PostgreSQL
# Les valeurs viennent de variables d'environnement (jamais de secret en dur).
# Valeurs par defaut uniquement pour le developpement local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rplace_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA / Hibernate
# validate : Hibernate verifie que le schema correspond aux entites,
# mais ne le modifie jamais. C'est Flyway qui gere le schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

### Flyway (migrations versionnees)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

### Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

### Serveur
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

### Actuator : seul /actuator/health expose (sondes et healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never